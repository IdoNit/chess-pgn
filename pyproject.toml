[project]
name = "chesspgn"
version = "0.1.0"
description = "Turn chess-book page screenshots into checked PGN files"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pytesseract>=0.3.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesspgn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a running Ollama with glm-ocr (pytest -m live)",
    "holdout: held-out acceptance pages (pytest -m holdout)",
]
addopts = "-m 'not live and not holdout'"
